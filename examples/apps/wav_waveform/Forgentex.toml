[package]
name = "wav-waveform"
version = "0.1.0"
root = "src"

[application]
forgentex = "0.1"
entry = "render_waveform"
runtime = "hosted_io"
effects = ["alloc", "fs.read", "fs.write"]

[application.limits]
max_read_bytes = 4194304
max_write_bytes = 65536

[application.artifact.waveform]
root = "output"
media_type = "image/x-portable-pixmap"
max_bytes = 65536
required = true
publication = "create_new"

[security]
trust = "untrusted"
signed_by = "agent-public-demo"
signature_algorithm = "Ed25519"
signature = "mock-sig-wav-waveform"
reproducible = true

[permissions]
fs.read = ["input"]
fs.write = ["output"]

[sandbox]
build_scripts = "deny"
codegen = "deny"
tests = "sandboxed"
agent_tools = "deny"
